name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # network proxy aggregate config
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}

  # token
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

  # network reachable
  REACHABLE: ${{ vars.REACHABLE }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        env:
          SUBSCRIBE_CONF_VALUE: ${{ secrets.SUBSCRIBE_CONF }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          value = os.environ.get("SUBSCRIBE_CONF_VALUE", "").strip()
          if not value:
              print("Error: secret 'SUBSCRIBE_CONF' cannot be empty")
              sys.exit(1)

          content = ""
          if value.startswith(("http://", "https://")):
              try:
                  request = urllib.request.Request(value, headers={"User-Agent": "aggregator-actions"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read().decode("utf8")
              except Exception as e:
                  print(f"Error: failed to fetch config from SUBSCRIBE_CONF url: {e}")
                  sys.exit(1)
          elif value.startswith("{"):
              content = value
          elif os.path.isfile(value):
              with open(value, "r", encoding="utf8") as f:
                  content = f.read()
          else:
              print("Error: secret 'SUBSCRIBE_CONF' must be a config URL, JSON string, or local file path")
              sys.exit(1)

          try:
              config = json.loads(content)
          except Exception as e:
              print(f"Error: SUBSCRIBE_CONF content is not valid JSON: {e}")
              sys.exit(1)

          storage = config.get("storage", {})
          engine = str(storage.get("engine", "")).strip().lower()
          supported = {"gist", "imperial", "pastefy", "pastegg", "qbin", "local"}
          if engine not in supported:
              print(f"Error: config.storage.engine must be one of {sorted(supported)}, got: {engine or '<empty>'}")
              sys.exit(1)

          items = storage.get("items", {})
          if not isinstance(items, dict) or not items:
              print("Error: config.storage.items must be a non-empty object")
              sys.exit(1)

          groups = config.get("groups", {})
          if not isinstance(groups, dict) or not groups:
              print("Error: config.groups must be a non-empty object")
              sys.exit(1)

          if engine != "local" and not os.environ.get("PUSH_TOKEN", "").strip():
              print("Error: secret 'PUSH_TOKEN' cannot be empty when storage.engine is not 'local'")
              sys.exit(1)

          print(f"Process config check passed, storage.engine={engine}")
          PY

      - name: Process
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -u subscribe/process.py --overwrite --max-proxies 100
          else
            python -u subscribe/process.py --overwrite
          fi

      - name: Timestamp
        run: date
